<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

    <h2>Forgot Password</h2>

    <p>Enter your username to continue.</p>

    <form method="post">
        {% csrf_token %}

        <label for="username">Username:</label>
        <input
            type="text"
            name="username"
            id="username"
            required
        >

        <button type="submit">Continue</button>
    </form>

    <p>
        <a href="{% url 'login' %}">Back to Login</a>
    </p>

</body>
</html>
