<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
</head>
<body>

    <h2>Verify OTP</h2>

    <p>Enter the OTP sent to your registered mobile number.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="otp">OTP:</label>

        <input
            type="text"
            name="otp"
            id="otp"
            maxlength="6"
            inputmode="numeric"
            required
        >

        <button type="submit">Verify OTP</button>
    </form>

</body>
</html>
