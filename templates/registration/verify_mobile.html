<!DOCTYPE html>
<html>
<head>
    <title>Verify Mobile Number</title>
</head>
<body>

    <h2>Verify Mobile Number</h2>

    <p>Enter the mobile number registered with your account.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="phone">Registered Mobile Number:</label>

        <input
            type="tel"
            name="phone"
            id="phone"
            required
            autocomplete="tel"
        >

        <button type="submit">Verify</button>
    </form>

    <p>
        <a href="{% url 'forgot_password' %}">Back</a>
    </p>

</body>
</html>
