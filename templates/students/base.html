<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* ==============================
           GLOBAL THEME
        ============================== */

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f4f7ff,
                #eef2ff,
                #f8faff
            );
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172554;
        }


        /* ==============================
           NAVBAR
        ============================== */

        .main-navbar {
            background: linear-gradient(
                135deg,
                #172554,
                #312e81,
                #1d4ed8
            );

            padding: 16px 0;

            box-shadow:
                0 4px 18px rgba(30, 41, 59, 0.25);

            position: relative;
            z-index: 10;
        }


        .brand-title {
            color: white !important;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;

            letter-spacing: 0.3px;

            transition: 0.3s;
        }

        .brand-title:hover {
            opacity: 0.9;
            transform: translateX(2px);
        }


        /* ==============================
           NAVIGATION LINKS
        ============================== */

        .nav-link-custom {
            color: #ffffff !important;
            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            margin-right: 18px;

            transition: 0.3s;
        }

        .nav-link-custom:hover {
            color: #c7d2fe !important;
        }


        /* ==============================
           LOGOUT BUTTON
        ============================== */

        .logout-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.35);

            border-radius: 8px;

            padding: 6px 15px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        .logout-btn:hover {
            background: white;
            color: #312e81;
            transform: translateY(-1px);
        }


        /* ==============================
           MAIN CONTENT
        ============================== */

        .main-container {
            padding-top: 28px;
            padding-bottom: 40px;
        }


        /* ==============================
           GENERAL CARDS
        ============================== */

        .card {
            border: none;
            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(30, 41, 59, 0.08);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(30, 41, 59, 0.14);
        }


        /* ==============================
           HEADINGS
        ============================== */

        h1,
        h2,
        h3,
        h4,
        h5 {
            color: #172554;
            font-weight: 700;
        }


        /* ==============================
           BUTTONS
        ============================== */

        .btn-primary {
            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            border: none;

            border-radius: 8px;

            font-weight: 600;

            box-shadow:
                0 4px 12px rgba(37, 99, 235, 0.25);

            transition: 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(
                135deg,
                #1d4ed8,
                #4338ca
            );

            transform: translateY(-1px);

            box-shadow:
                0 6px 16px rgba(37, 99, 235, 0.35);
        }


        /* ==============================
           TABLE
        ============================== */

        .table {
            border-radius: 12px;
            overflow: hidden;

            background: white;

            box-shadow:
                0 6px 20px rgba(30, 41, 59, 0.06);
        }


        /* ==============================
           LINKS
        ============================== */

        a {
            color: #2563eb;
        }

        a:hover {
            color: #4338ca;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 768px) {

            .brand-title {
                font-size: 18px;
            }

            .nav-link-custom {
                margin-right: 8px;
                font-size: 14px;
            }

            .main-container {
                padding-top: 20px;
            }
        }

    </style>
</head>


<body>

    <!-- ==============================
         NAVBAR
    ============================== -->

    <nav class="main-navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <!-- Brand -->

            <a
                class="brand-title"
                href="{% url 'dashboard' %}"
            >
                🎓 Student Management System
            </a>


            <!-- Navigation -->

            {% if user.is_authenticated %}

                <div class="d-flex align-items-center">

                    <a
                        class="nav-link-custom"
                        href="{% url 'student-list' %}"
                    >
                        Students
                    </a>


                    <form
                        method="post"
                        action="{% url 'logout' %}"
                        style="display: inline;"
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="logout-btn"
                        >
                            Logout
                        </button>

                    </form>

                </div>

            {% endif %}

        </div>

    </nav>


    <!-- ==============================
         MAIN CONTENT
    ============================== -->

    <main class="container main-container">

        {% block content %}

        {% endblock %}

    </main>


</body>
</html>
