{% extends "students/base.html" %}

{% block content %}

<h2>Delete Student</h2>

<p>
    Are you sure you want to delete
    <strong>{{ object }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button class="btn btn-danger">
        Yes, Delete
    </button>

    <a
        href="{% url 'student-list' %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>
</form>

{% endblock %}
