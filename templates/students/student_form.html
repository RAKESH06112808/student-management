{% extends "students/base.html" %}

{% block content %}

<h2>
    {% if object %}
        Edit Student
    {% else %}
        Add Student
    {% endif %}
</h2>

<div class="card mt-3">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary">
                Save
            </button>

            <a
                href="{% url 'student-list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
